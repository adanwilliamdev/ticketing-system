services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ticketing_user
      POSTGRES_PASSWORD: ticketing_pass
      POSTGRES_DB: ticketing_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing_user -d ticketing_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # `docker compose --profile app up --build` sobe a aplicação inteira.
  # Sem --profile app, só PostgreSQL e Redis sobem (útil ao rodar a aplicação localmente
  # com `mvn spring-boot:run` durante o desenvolvimento).
  app:
    profiles: ["app"]
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ticketing_db
      DB_USER: ticketing_user
      DB_PASSWORD: ticketing_pass
      REDIS_HOST: redis
      SEED_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
