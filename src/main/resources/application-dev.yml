spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ticketing_db
    username: ticketing_user
    password: ticketing_pass
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true

  redis:
    host: localhost
    port: 6379

logging:
  level:
    com.ticketing: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: DEBUG
