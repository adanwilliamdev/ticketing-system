<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · EventHub'">EventHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="header" class="site-header">
    <div class="site-header-inner">
        <a class="brand" th:href="@{/}">
      <span class="brand-logo">
        <svg th:replace="~{fragments/icons :: ticket}"></svg>
      </span>
            <span class="brand-text">
        <span class="brand-name">EventHub</span>
        <span class="brand-tagline">Experiências Vivas</span>
      </span>
        </a>
    </div>
</header>
</body>
</html>
