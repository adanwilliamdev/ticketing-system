<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Dark mode bootstrap — precisa rodar ANTES do CSS para evitar flash -->
    <script>
        (function () {
          try {
            var saved = localStorage.getItem('theme');
            var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'dark' || (!saved && prefersDark)) {
              document.documentElement.setAttribute('data-theme', 'dark');
            } else if (saved === 'light') {
              document.documentElement.setAttribute('data-theme', 'light');
            }
          } catch (e) { /* localStorage bloqueado — segue preferência do sistema via CSS */ }
        })();
    </script>
    <title th:text="${title} + ' · EventHub'">EventHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header th:fragment="header" class="site-header">
    <div class="site-header-inner">
        <a class="brand" th:href="@{/}">
      <span class="brand-logo">
        <svg th:replace="~{fragments/icons :: ticket}"></svg>
      </span>
            <span class="brand-text">
        <span class="brand-name">EventHub</span>
        <span class="brand-tagline">Experiências Vivas</span>
      </span>
        </a>
        <button id="theme-toggle" type="button" class="icon-btn" aria-label="Alternar tema claro/escuro">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
    </div>
    <script>
        (function () {
          var btn = document.getElementById('theme-toggle');
          if (!btn) return;

          var SUN = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
          var MOON = '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

          function isDark() {
            return document.documentElement.getAttribute('data-theme') === 'dark';
          }

          function sync() {
            var dark = isDark();
            btn.innerHTML = dark ? SUN : MOON;
            btn.setAttribute('aria-label', dark ? 'Ativar tema claro' : 'Ativar tema escuro');
            btn.setAttribute('title', dark ? 'Tema claro' : 'Tema escuro');
          }

          btn.addEventListener('click', function () {
            var next = isDark() ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('theme', next); } catch (e) {}
            sync();
          });

          sync();
        })();
    </script>
</header>

</body>
</html>
