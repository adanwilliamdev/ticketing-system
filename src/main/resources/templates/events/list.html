<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head('Eventos')}"></head>
<body>
<div class="container">
  <main class="stack-lg">
    <div>
      <h1 class="title">Eventos disponíveis</h1>
      <p class="muted">Escolha um evento para ver os assentos e reservar o seu.</p>
    </div>

    <p class="empty muted" th:if="${#lists.isEmpty(events)}">Nenhum evento disponível no momento.</p>

    <div class="grid" th:unless="${#lists.isEmpty(events)}">
      <a class="card-link" th:each="event : ${events}" th:href="@{/events/{id}(id=${event.id})}">
        <article class="card card-hover">
          <header class="card-header">
            <div class="row between start">
              <h2 class="card-title" th:text="${event.name}">Evento</h2>
              <span class="badge badge-secondary" th:text="${@fmt.currency(event.price)}">R$ 0,00</span>
            </div>
          </header>
          <div class="card-content stack-sm muted small">
            <div class="row gap-sm">
              <svg th:replace="~{fragments/icons :: calendar}"></svg>
              <span th:text="${@fmt.dateTime(event.startDateTime)}">data</span>
            </div>
            <div class="row gap-sm" th:if="${event.location != null}">
              <svg th:replace="~{fragments/icons :: pin}"></svg>
              <span th:text="${event.location}">local</span>
            </div>
            <div class="row gap-sm">
              <svg th:replace="~{fragments/icons :: ticket}"></svg>
              <span th:text="${event.availableTickets} + ' ingressos disponíveis'">0 ingressos disponíveis</span>
            </div>
          </div>
        </article>
      </a>
    </div>
  </main>
</div>
</body>
</html>
